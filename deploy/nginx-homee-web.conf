# Bản web/PWA — copy lên VPS: /etc/nginx/sites-available/homee-web, symlink sang sites-enabled,
# rồi `sudo certbot --nginx -d homee.cristhedev.com` để có HTTPS (PWA bắt buộc HTTPS).
# File tĩnh do .github/workflows/deploy-web.yml đẩy lên /var/www/homee-web.
server {
    listen 80;
    server_name homee.cristhedev.com;
    root /var/www/homee-web;

    # Bundle JS ~3MB — nén gzip còn ~700KB, quan trọng với 4G công trường.
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1024;

    # Bundle có hash trong tên — cache lâu.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # index.html + sw.js luôn lấy bản mới để user nhận bản cập nhật.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    # SPA: mọi route (/step/..., /project/...) trả về index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
