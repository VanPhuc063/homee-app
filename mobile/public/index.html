<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16A34A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Homeee" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Homeee</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      /* Mở trên máy tính thì giữ khung điện thoại ở giữa. */
      body { background: #E5E7EB; }
      #root { display: flex; height: 100%; flex: 1; max-width: 480px; margin: 0 auto; background: #F7F8FA; }
    </style>
    <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));</script>
  </head>
  <body>
    <noscript>Cần bật JavaScript để dùng Homeee.</noscript>
    <div id="root"></div>
  </body>
</html>
